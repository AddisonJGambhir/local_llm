<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ocean Scene — Three.js</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #app { position: fixed; inset: 0; }
    .hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      font-family: system-ui, sans-serif; color: rgba(255,255,255,.85);
      font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,.8);
      background: rgba(0,0,0,.35); backdrop-filter: blur(6px);
      padding: 10px 14px; border-radius: 10px; line-height: 1.7;
    }
    .hud b { display: block; margin-bottom: 2px; letter-spacing: .05em; }
    .hud kbd {
      background: rgba(255,255,255,.15); border-radius: 4px;
      padding: 1px 6px; font-size: 11px; font-family: inherit;
    }
  </style>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <b>OCEAN SCENE</b>
  <kbd>drag</kbd> orbit &nbsp;<kbd>scroll</kbd> zoom<br/>
  <kbd>C</kbd> cycle time of day &nbsp;<kbd>Space</kbd> pause waves
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Water } from 'three/addons/objects/Water.js';
import { Sky } from 'three/addons/objects/Sky.js';

// ---------- renderer ----------
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;
container.appendChild(renderer.domElement);

// ---------- scene / camera ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 20000);
camera.position.set(30, 22, 90);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.495; // keep camera above water
controls.minDistance = 20;
controls.maxDistance = 800;

// ---------- sun ----------
let water = null; // created below; referenced by setSunFromAngles
const sun = new THREE.Vector3();
const sunLight = new THREE.DirectionalLight(0xffffff, 3);
scene.add(sunLight);

// ---------- sky ----------
const sky = new Sky();
sky.scale.setScalar(10000);
scene.add(sky);

const skyUniforms = sky.material.uniforms;
skyUniforms.turbidity.value = 8;
skyUniforms.rayleigh.value = 2.5;
skyUniforms.mieCoefficient.value = 0.004;
skyUniforms.mieDirectionalG.value = 0.85;

function setSunFromAngles(elevationDeg, azimuthDeg) {
  const phi = THREE.MathUtils.degToRad(90 - elevationDeg);
  const theta = THREE.MathUtils.degToRad(azimuthDeg);
  sun.setFromSphericalCoords(1, phi, theta);
  skyUniforms.sunPosition.value.copy(sun);
  sunLight.position.copy(sun).multiplyScalar(1000);
  if (water) water.material.uniforms.sunDirection.value.copy(sun).normalize();
}
setSunFromAngles(4, 160); // low golden-hour sun

// ---------- water ----------
const waterGeometry = new THREE.PlaneGeometry(8000, 8000, 256, 256);

water = new Water(waterGeometry, {
  textureWidth: 512,
  textureHeight: 512,
  waterNormals: loadNormals(),
  sunDirection: sun.clone(),
  sunColor: 0xffffff,
  waterColor: 0x001e2b,
  distortionScale: 3.4,
  fog: false
});
water.rotation.x = -Math.PI / 2;
water.material.uniforms.size.value = 4; // wave detail scale
scene.add(water);

// Procedurally generate a tileable water normal map (no network dependency).
function loadNormals() {
  const SIZE = 512;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = SIZE;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(SIZE, SIZE);

  // Sum of tileable sine waves -> height field, then finite-difference normals.
  // Each wave is an integer number of cycles over the tile so it wraps seamlessly.
  const waves = [];
  let rng = 12345;
  const rand = () => (rng = (rng * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = 0; i < 28; i++) {
    const kx = Math.round((rand() * 2 - 1) * (2 + i * 0.6));
    const ky = Math.round((rand() * 2 - 1) * (2 + i * 0.6));
    if (kx === 0 && ky === 0) continue;
    waves.push({ kx, ky, amp: 1 / Math.hypot(kx, ky), phase: rand() * Math.PI * 2 });
  }
  const height = (x, y) => {
    let h = 0;
    for (const w of waves) {
      h += w.amp * Math.sin(2 * Math.PI * (w.kx * x + w.ky * y) / SIZE + w.phase);
    }
    return h;
  };

  const strength = 1.6;
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const dx = height(x + 1, y) - height(x - 1, y);
      const dy = height(x, y + 1) - height(x, y - 1);
      const n = new THREE.Vector3(-dx * strength, -dy * strength, 1).normalize();
      const idx = (y * SIZE + x) * 4;
      img.data[idx] = (n.x * 0.5 + 0.5) * 255;
      img.data[idx + 1] = (n.y * 0.5 + 0.5) * 255;
      img.data[idx + 2] = (n.z * 0.5 + 0.5) * 255;
      img.data[idx + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

// ---------- buoy (gives the scene a sense of scale + specular anchor) ----------
const buoyGroup = new THREE.Group();

const hullMat = new THREE.MeshStandardMaterial({ color: 0xcc3322, roughness: 0.55, metalness: 0.25 });
const hull = new THREE.Mesh(new THREE.CylinderGeometry(3, 4, 5, 24), hullMat);
buoyGroup.add(hull);

const topMat = new THREE.MeshStandardMaterial({ color: 0x222831, roughness: 0.6 });
const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 9, 12), topMat);
mast.position.y = 6.5;
buoyGroup.add(mast);

const beaconMat = new THREE.MeshStandardMaterial({
  color: 0xffdd66, emissive: 0xffaa00, emissiveIntensity: 2.2, roughness: 0.3
});
const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.65, 16, 16), beaconMat);
beacon.position.y = 11.2;
buoyGroup.add(beacon);
const beaconPulse = new THREE.PointLight(0xffaa33, 40, 60, 2);
beaconPulse.position.y = 11.2;
buoyGroup.add(beaconPulse);

buoyGroup.position.y = -1.2; // partially submerged
scene.add(buoyGroup);

// ---------- state ----------
const params = {
  presets: [
    { name: 'Golden Hour', elevation: 4,  azimuth: 160, exposure: 0.55, rayleigh: 2.5 },
    { name: 'Midday',      elevation: 62, azimuth: 180, exposure: 0.42, rayleigh: 1.2 },
    { name: 'Sunset',      elevation: 0.8, azimuth: 205, exposure: 0.62, rayleigh: 3.5 },
    { name: 'Night',       elevation: -3.5, azimuth: 180, exposure: 0.85, rayleigh: 0.6 }
  ],
  presetIndex: 0,
  wavesPaused: false
};

function applyPreset(i) {
  const p = params.presets[i];
  setSunFromAngles(p.elevation, p.azimuth);
  renderer.toneMappingExposure = p.exposure;
  skyUniforms.rayleigh.value = p.rayleigh;
  const night = p.elevation < 0;
  sunLight.intensity = night ? 0.15 : 3;
  sunLight.color.set(night ? 0x8899cc : 0xffffff);
  water.material.uniforms.waterColor.value.set(night ? 0x000a14 : 0x001e2b);
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyC') {
    params.presetIndex = (params.presetIndex + 1) % params.presets.length;
    applyPreset(params.presetIndex);
  } else if (e.code === 'Space') {
    e.preventDefault();
    params.wavesPaused = !params.wavesPaused;
  }
});

// ---------- animation loop ----------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const t = clock.elapsedTime;

  if (!params.wavesPaused) {
    water.material.uniforms.time.value += delta * 0.8;
  }

  // gentle buoy bobbing synced to the wave motion
  buoyGroup.position.y = -1.2 + Math.sin(t * 0.9) * 0.45;
  buoyGroup.rotation.z = Math.sin(t * 0.7) * 0.03;
  buoyGroup.rotation.x = Math.cos(t * 0.55) * 0.03;

  // pulsing beacon
  const pulse = (Math.sin(t * 2.4) + 1) / 2;
  beaconPulse.intensity = 8 + pulse * 50;
  beacon.material.emissiveIntensity = 1 + pulse * 2.5;

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.__dbg = { water, sky, renderer, scene, camera };

// ---------- resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
