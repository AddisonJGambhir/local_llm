name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret detection (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: shellcheck
        run: |
          set -euo pipefail
          # Check tracked files that carry a shell shebang.
          # Sourced profile files are excluded: their whole purpose is to
          # define variables consumed by common.sh, so SC2034 is a false positive there.
          mapfile -t files < <(
            git ls-files -z \
              | xargs -0 grep -lE '^#!.*(ba|z|da)?sh' \
              | grep -v '^llama_server/config/profiles/' \
              | sort
          )
          echo "Checking ${#files[@]} files:"
          printf '  %s\n' "${files[@]}"
          shellcheck --severity=warning "${files[@]}"

  python:
    name: Python (syntax + basic checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall -q llama_server

      - name: Ruff (errors + undefined names)
        run: |
          pip install ruff -q
          ruff check --select E9,F llama_server
